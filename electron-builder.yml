appId: de.rohde.dienstplan
productName: Dienstplan
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  # Entwicklungswerkzeug, gehört nicht zur ausgelieferten Anwendung.
  - '!.claude/**'
  # Einstufig ('!src/*') greift nicht für Unterordner — der gesamte Quellcode landete
  # sonst mit im Installer.
  - '!src/**'
  - '!e2e/**'
  - '!docs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!vitest.e2e.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!components.json'
asarUnpack:
  - resources/**
win:
  executableName: Dienstplan
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# better-sqlite3 v13 liefert N-API-Prebuilds mit; ein Rebuild gegen die Electron-ABI ist
# nicht nötig. Siehe docs/architektur/technologieentscheidungen.md.
npmRebuild: false
